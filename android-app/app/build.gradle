plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arudra.attendance'
    compileSdk 34
    defaultConfig {
        applicationId 'com.arudra.attendance'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // The deployed web app (HTTPS required for GPS/camera). Override: gradle -PappUrl=https://hr.example.com
        buildConfigField 'String', 'APP_URL', "\"${project.findProperty('appUrl') ?: 'https://CHANGE-ME.example.com'}\""
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
