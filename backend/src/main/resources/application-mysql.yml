spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/attendance?useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      # Cloud DBs (e.g. TiDB Starter) can be slow to wake and TLS handshakes are
      # slow on small instances; allow more time before giving up.
      connection-timeout: 60000
      initialization-fail-timeout: 60000
      data-source-properties:
        # The database may be in any country. Pin the connection to IST so TIMESTAMP columns are stored and read as IST wall-clock
        # time whatever the DB server's own zone (the JVM default is also IST, see AttendanceApplication). Do not put serverTimezone in DB_URL.
        connectionTimeZone: "+05:30"
        forceConnectionTimeZoneToSession: true
        connectTimeout: 30000
        socketTimeout: 60000
  flyway:
    connect-retries: 5
    connect-retries-interval: 5s
